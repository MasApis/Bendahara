name: Bot Pengingat Kas Otomatis

on:
  schedule:
    # Berjalan otomatis setiap hari jam 01:00 UTC (Sama dengan Jam 08:00 WIB pagi)
    - cron: '0 1 * * *'
  workflow_dispatch: # Tombol rahasia agar bisa tes jalankan manual

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Eksekusi Bot Pengingat
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_API_TOKEN: ${{ secrets.GREEN_API_API_TOKEN }}
          GREEN_API_CHAT_ID: ${{ secrets.GREEN_API_CHAT_ID }}
        run: node cron-reminder.js