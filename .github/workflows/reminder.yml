name: Bot Pengingat Kas Otomatis Cron

on:
  schedule:
    # Berjalan setiap hari Senin, Kamis, dan Sabtu jam 07:30 WIB (00:30 UTC)
    # Sesuaikan menit/jam sesuai preferensi distribusi broadcast Anda
    - cron: '0 1 * * *' # Jalan tiap menit ke-0 di setiap jam
  workflow_dispatch: # Memungkinkan trigger manual dari dashboard GitHub untuk testing

jobs:
  run-reminder:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # PERBAIKAN: Menggunakan properti 'node-version' yang valid

    - name: Install Dependencies
      run: |
        npm install firebase-admin axios

    - name: Eksekusi Skrip dengan Zona Waktu Asia/Jakarta
      env:
        # Kunci utama agar kalender sistem di NodeJS membaca waktu Indonesia
        TZ: 'Asia/Jakarta'
        # Taruh Service Account Firebase Anda di GitHub Secrets demi keamanan SaaS
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: node cron-reminder.js